<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:280px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .fig{position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line-2);}
  .fig img{width:100%;height:100%;object-fit:cover;filter:grayscale(20%) contrast(1.05) brightness(0.98);display:block;}
  .cap{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-2);color:var(--muted);text-transform:uppercase;margin-top:8px;}
  .h{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-3);color:var(--muted);text-transform:uppercase;margin-bottom:12px;}

</style></head><body>
<div class="h">EDITORIAL FILTER — grayscale(20%) contrast(1.05) brightness(0.98)</div>
<div class="row">
  <div><div class="fig"><img src="../assets/porsche-911-gt3.jpg" alt=""/></div><div class="cap">Sports · exterior</div></div>
  <div><div class="fig"><img src="../assets/porsche-interior.jpg" alt=""/></div><div class="cap">Interior · cabin</div></div>
  <div><div class="fig"><img src="../assets/hero-highway.jpg" alt=""/></div><div class="cap">Environmental · hero</div></div>
</div>
</body></html>
