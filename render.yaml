services:
  - type: web
    name: authentiq-app
    runtime: node
    rootDir: app
    buildCommand: npm ci && npm run build && npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_SITE_URL
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: vehicle-media
      - key: PRIVACY_POLICY_VERSION
        value: 2026-08-09
