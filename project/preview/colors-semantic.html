<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:180px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .big{aspect-ratio:2.2/1;padding:16px;display:flex;flex-direction:column;justify-content:space-between;}
  .n{font:var(--t-title);letter-spacing:var(--ls-tight4);color:#faf8f5;}
  .h{font:var(--t-mono-sm);letter-spacing:var(--ls-mono-2);color:#faf8f5;opacity:.75;}
  .usage{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-2);text-transform:uppercase;color:#faf8f5;opacity:.75;margin-top:6px;}

</style></head><body>
<div class="row2">
  <div class="big" style="background:#b04a3a;">
    <div><div class="n">danger</div><div class="usage">below-asking diff · chat notif</div></div>
    <div class="h">#B04A3A</div>
  </div>
  <div class="big" style="background:#4b7a5c;">
    <div><div class="n">success</div><div class="usage">offer at/above · online status · history</div></div>
    <div class="h">#4B7A5C</div>
  </div>
</div>
</body></html>
