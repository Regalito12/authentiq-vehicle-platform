<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:240px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row2{display:flex;flex-direction:column;gap:10px;}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;font-weight:400;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.small{padding:10px 16px;font-size:10px;}
  .arrow{width:14px;height:1px;background:currentColor;position:relative;}
  .arrow::after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg);}
  .lbl{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-3);text-transform:uppercase;color:var(--muted);}

</style></head><body>
<div class="grid">
  <div class="row2">
    <div class="lbl">PRIMARY</div>
    <button class="btn">Explorar catálogo <span class="arrow"></span></button>
    <button class="btn small">Confirmar</button>
  </div>
  <div class="row2">
    <div class="lbl">GHOST</div>
    <button class="btn ghost">Agendar visita <span class="arrow"></span></button>
    <button class="btn ghost small">Descartar</button>
  </div>
</div>
</body></html>
