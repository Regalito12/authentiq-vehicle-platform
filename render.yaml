services:
  - type: web
    name: authentiq-app
    runtime: node
    rootDir: app
    buildCommand: npm ci && npm run build && npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    plan: starter
    disk:
      name: authentiq-uploads
      mountPath: /var/lib/authentiq/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: authentiq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_SITE_URL
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: UPLOADS_DIR
        value: /var/lib/authentiq/uploads
      - key: PRIVACY_POLICY_VERSION
        value: 2026-08-09

databases:
  - name: authentiq-db
    plan: free
    databaseName: authentiq
    user: authentiq
