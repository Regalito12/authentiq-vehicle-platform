<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:160px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .stack{display:flex;flex-direction:column;gap:14px;}
  .h{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-3);color:var(--muted);text-transform:uppercase;}
  .mode-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:var(--f-mono);font-size:11px;letter-spacing:0.05em;background:var(--bg);}
  .mode-toggle button{padding:8px 18px;text-transform:uppercase;opacity:0.5;background:none;border:none;cursor:pointer;color:var(--ink);}
  .mode-toggle button.active{background:var(--ink);color:var(--bg);opacity:1;}
  .lang{font-family:var(--f-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:none;color:var(--ink);cursor:pointer;padding:8px 0;display:inline-flex;gap:8px;}
  .lang .active{opacity:1;}
  .lang .off{opacity:0.4;}

</style></head><body>
<div class="stack">
  <div>
    <div class="h" style="margin-bottom:8px;">MODE TOGGLE — buyer / dealer</div>
    <div class="mode-toggle">
      <button class="active">Comprador</button>
      <button>Concesionario</button>
    </div>
  </div>
  <div>
    <div class="h" style="margin-bottom:8px;">LANGUAGE TOGGLE</div>
    <div class="lang"><span class="active">ES</span>/<span class="off">EN</span></div>
  </div>
</div>
</body></html>
