<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:220px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .stack{display:flex;flex-direction:column;gap:14px;}
  .item{border-bottom:1px solid var(--line-2);padding-bottom:12px;}
  .item:last-child{border:none;padding-bottom:0;}
  .body{font:var(--t-body);color:var(--ink-soft);max-width:520px;}
  .copy{font:var(--t-copy);color:var(--ink-soft);max-width:520px;line-height:1.55;}
  .spec{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-2);color:var(--muted);text-transform:uppercase;margin-bottom:6px;}

</style></head><body>
<div class="stack">
  <div class="item">
    <div class="spec">BODY · Inter Tight 400 · 15 / 1.4</div>
    <div class="body">Una plataforma para descubrir, configurar y adquirir vehículos con la misma precisión con la que fueron diseñados.</div>
  </div>
  <div class="item">
    <div class="spec">COPY · Inter Tight 400 · 14 / 1.55</div>
    <div class="copy">Cada modelo, verificado. Cada oferta, transparente. La confianza como estándar operativo, no como promesa.</div>
  </div>
</div>
</body></html>
