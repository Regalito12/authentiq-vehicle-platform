services:
  - type: web
    name: authentiq-app
    runtime: node
    rootDir: app
    buildCommand: npm ci && npm run check:production && npm run build && npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_SITE_URL
        fromService:
          type: web
          name: authentiq-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: vehicle-media
      # Opcional: activa el subdominio automático por dealer (automotor.tudominio.com).
      # Déjala vacía/sin agregar hasta comprar el dominio, apuntar el DNS comodín (*)
      # a este servicio, y agregar ese dominio comodín en Render → Custom Domains.
      - key: PLATFORM_BASE_DOMAIN
        sync: false
      - key: PRIVACY_POLICY_VERSION
        value: 2026-08-09
      - key: BOT_PROTECTION_REQUIRED
        value: "true"
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: VITE_HERO_VIDEO_URL
        sync: false
      - key: GOOGLE_CALENDAR_REQUIRED
        value: "true"
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        sync: false
      - key: GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY
        sync: false
