<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AUTHENTIQ — UI Kit</title>

  <!-- Design tokens -->
  <link rel="stylesheet" href="../../colors_and_type.css">
  <!-- Component styles (from source prototype) -->
  <link rel="stylesheet" href="../../source/styles.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="Buttons.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Card.jsx"></script>
  <script type="text/babel" src="ReviewCard.jsx"></script>
  <script type="text/babel" src="Home.jsx"></script>
  <script type="text/babel" src="Detail.jsx"></script>

  <script type="text/babel">
    function App() {
      // Default landing = home; localStorage preserves position on manual refresh only
      const [screen, setScreen] = React.useState(() => localStorage.getItem("authentiq_kit_screen") || "home");
      const [vehicleId, setVehicleId] = React.useState(() => localStorage.getItem("authentiq_kit_vehicle") || CATALOG[0].id);

      React.useEffect(() => { localStorage.setItem("authentiq_kit_screen", screen); }, [screen]);
      React.useEffect(() => { localStorage.setItem("authentiq_kit_vehicle", vehicleId); }, [vehicleId]);

      const vehicle = CATALOG.find(v => v.id === vehicleId) || CATALOG[0];
      const openVehicle = (v) => {
        setVehicleId(v.id);
        setScreen("detail");
        window.scrollTo(0, 0);
      };

      return (
        <>
          <Nav
            current={screen === "home" ? "home" : "home"}
            onNav={(id) => { setScreen("home"); window.scrollTo(0, 0); }}
          />
          <div className="stage" data-screen-label={screen === "home" ? "01 Home" : "02 Detail"}>
            {screen === "home"
              ? <Home onOpen={openVehicle} />
              : <Detail vehicle={vehicle} onBack={() => { setScreen("home"); window.scrollTo(0, 0); }} />
            }
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
