<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:200px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .stack{display:flex;flex-direction:column;gap:6px;}
  .row{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:4px 0;}
  .k{font:var(--t-mono-sm);letter-spacing:var(--ls-mono-1);color:var(--muted);}
  .bar{background:var(--ink);height:6px;}
  .v{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-2);color:var(--muted);text-transform:uppercase;}

</style></head><body>
<div class="stack">
  <div class="row"><span class="k">s-1</span><div class="bar" style="width:4px;"></div><span class="v">4 · micro</span></div>
  <div class="row"><span class="k">s-2</span><div class="bar" style="width:8px;"></div><span class="v">8 · slot gap</span></div>
  <div class="row"><span class="k">s-4</span><div class="bar" style="width:16px;"></div><span class="v">16 · panel gap</span></div>
  <div class="row"><span class="k">s-6</span><div class="bar" style="width:24px;"></div><span class="v">24 · card padding</span></div>
  <div class="row"><span class="k">s-8</span><div class="bar" style="width:32px;"></div><span class="v">32 · nav padding</span></div>
  <div class="row"><span class="k">s-10</span><div class="bar" style="width:40px;"></div><span class="v">40 · detail gap</span></div>
  <div class="row"><span class="k">s-12</span><div class="bar" style="width:48px;"></div><span class="v">48 · section h-pad</span></div>
  <div class="row"><span class="k">s-25</span><div class="bar" style="width:100px;"></div><span class="v">100 · section top</span></div>
</div>
</body></html>
