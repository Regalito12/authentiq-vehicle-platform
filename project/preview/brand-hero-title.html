<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:320px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  body{background:var(--bg-alt);padding:32px;}
  .demo{position:relative;padding:0;min-height:220px;display:flex;align-items:center;overflow:hidden;background:var(--bg);border:1px solid var(--line-2);}
  .bg{position:absolute;inset:0;}
  .bg img{width:100%;height:100%;object-fit:cover;filter:grayscale(20%) contrast(1.05);}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(250,248,245,0.75) 0%, rgba(250,248,245,0.55) 40%, rgba(250,248,245,0.95) 100%);}
  .t{position:relative;z-index:2;padding:24px 32px;font-family:var(--f-display);font-weight:500;font-size:88px;line-height:0.88;letter-spacing:-0.04em;mix-blend-mode:multiply;}
  .t .thin{font-weight:300;}
  .t .italic{font-style:italic;color:var(--accent);font-weight:400;}

</style></head><body>
<div class="demo">
  <div class="bg"><img src="../assets/hero-highway.jpg" alt=""/></div>
  <div class="t"><span class="thin">Conducir</span> es<br/><span class="italic">elegir.</span></div>
</div>
</body></html>
