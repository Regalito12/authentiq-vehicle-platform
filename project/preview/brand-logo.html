<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:180px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .stack{display:flex;flex-direction:column;gap:18px;}
  .item{display:flex;align-items:center;gap:20px;}
  .logo{font-family:var(--f-display);font-weight:700;letter-spacing:-0.02em;display:inline-flex;align-items:center;gap:10px;}
  .logo::before{content:"";width:22px;height:22px;border:1.5px solid currentColor;border-radius:50%;background:linear-gradient(45deg,transparent 47%,currentColor 47%,currentColor 53%,transparent 53%),linear-gradient(-45deg,transparent 47%,currentColor 47%,currentColor 53%,transparent 53%);}
  .logo.big{font-size:32px;}
  .logo.big::before{width:36px;height:36px;border-width:2px;}
  .logo.on-dark{color:var(--bg);}
  .on-dark-wrap{background:var(--ink);padding:14px 20px;display:inline-block;}
  .spec{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-2);color:var(--muted);text-transform:uppercase;}

</style></head><body>
<div class="stack">
  <div class="item">
    <div class="logo big">AUTHENTIQ</div>
    <span class="spec">Wordmark · Inter Tight 700 · -0.02em · CSS-drawn emblem (crossed diagonals in a circle)</span>
  </div>
  <div class="item">
    <div class="on-dark-wrap"><div class="logo big on-dark">AUTHENTIQ</div></div>
    <span class="spec">On dark — B2B mode</span>
  </div>
</div>
</body></html>
