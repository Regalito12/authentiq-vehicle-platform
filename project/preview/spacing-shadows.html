<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:220px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .box{background:var(--bg);border:1px solid var(--line-2);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:100px;justify-content:space-between;}
  .box.fab{background:var(--ink);color:var(--bg);box-shadow:0 10px 40px rgba(10,10,10,0.2);}
  .box.panel{box-shadow:-20px 0 60px rgba(10,10,10,0.08);}
  .box.hero{filter:drop-shadow(0 20px 30px rgba(10,10,10,0.18));background:var(--bg-alt);}
  .k{font:var(--t-mono-sm);letter-spacing:var(--ls-mono-1);}
  .v{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-2);color:var(--muted);text-transform:uppercase;}
  .box.fab .v{color:rgba(250,248,245,0.6);}
  .h{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-3);color:var(--muted);text-transform:uppercase;margin-bottom:12px;}

</style></head><body>
<div class="h">ELEVATION — used surgically, never on cards</div>
<div class="grid">
  <div class="box fab"><div class="k">shadow-fab</div><div class="v">0 10 40 · compare / chat FAB</div></div>
  <div class="box panel"><div class="k">shadow-panel</div><div class="v">-20 0 60 · chat slide-out</div></div>
  <div class="box hero"><div class="k">shadow-hero</div><div class="v">drop-shadow 0 30 60 · hero vehicle</div></div>
</div>
</body></html>
