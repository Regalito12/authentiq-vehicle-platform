<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:200px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  body{background:#0d0c0a;color:#f2eee7;}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sw{aspect-ratio:1.4/1;border:1px solid #2a2620;padding:10px;display:flex;flex-direction:column;justify-content:space-between;}
  .sw .n{font:var(--t-mono-sm);letter-spacing:var(--ls-mono-2);text-transform:uppercase;}
  .sw .h{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-1);opacity:.6;}
  .label{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-3);text-transform:uppercase;color:#8a857c;margin-bottom:12px;}

</style></head><body>
<div class="label">DEALER (B2B) — body.b2b</div>
<div class="swatches">
  <div class="sw" style="background:#0d0c0a;color:#f2eee7;"><span class="n">dark-bg</span><span class="h">#0D0C0A</span></div>
  <div class="sw" style="background:#17150f;color:#f2eee7;"><span class="n">dark-bg-2</span><span class="h">#17150F</span></div>
  <div class="sw" style="background:#1e1c17;color:#f2eee7;"><span class="n">line-2</span><span class="h">#1E1C17</span></div>
  <div class="sw" style="background:#2a2620;color:#f2eee7;"><span class="n">dark-line</span><span class="h">#2A2620</span></div>
  <div class="sw" style="background:#8a857c;color:#0d0c0a;"><span class="n">muted</span><span class="h">#8A857C</span></div>
  <div class="sw" style="background:#c8c3ba;color:#0d0c0a;"><span class="n">ink-soft</span><span class="h">#C8C3BA</span></div>
  <div class="sw" style="background:#ebe6dc;color:#0d0c0a;"><span class="n">ink-2</span><span class="h">#EBE6DC</span></div>
  <div class="sw" style="background:#f2eee7;color:#0d0c0a;"><span class="n">dark-ink</span><span class="h">#F2EEE7</span></div>
</div>
</body></html>
