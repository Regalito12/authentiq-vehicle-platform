<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:230px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .demo{padding:22px;background:var(--bg-alt);border:1px solid var(--line-2);}
  .eyebrow{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-3);text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .eyebrow .dot{width:6px;height:6px;background:var(--accent);border-radius:50%;}
  .title{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:0.95;letter-spacing:-0.03em;margin-bottom:10px;}
  .title .italic{font-style:italic;color:var(--accent);}
  .price{font:var(--t-mono-lg);letter-spacing:0.02em;color:var(--ink);}
  .price .cur{color:var(--muted);}

</style></head><body>
<div class="demo">
  <div class="eyebrow"><span class="dot"></span>Ed. 2026 — Colección de otoño</div>
  <div class="title">Porsche 911 <span class="italic">GT3</span></div>
  <div class="price"><span class="cur">USD</span> $189,500</div>
</div>
</body></html>
