<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{padding:20px;box-sizing:border-box;min-height:160px;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  
  .stack{display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
  .toast{padding:14px 24px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12px;letter-spacing:0.05em;display:inline-flex;align-items:center;gap:10px;}
  .h{font:var(--t-mono-xs);letter-spacing:var(--ls-mono-3);color:var(--muted);text-transform:uppercase;}

</style></head><body>
<div class="stack">
  <div class="h">CONFIRMATION TOASTS — mono 12 · ink bg · unicode ✓</div>
  <div class="toast">✓ Cita confirmada — 28 nov · 14:15</div>
  <div class="toast">✓ Oferta enviada — $175,000</div>
  <div class="toast">✓ Vehículo añadido al comparador</div>
</div>
</body></html>
